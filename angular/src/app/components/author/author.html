<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col col-md-6">
                <h5 class="card-title">
                    {{ '::Menu:Authors' | abpLocalization }}
                </h5>
            </div>
            <div class="text-end col col-md-6">
                <div class="text-lg-end pt-2">
                    <button *abpPermission="'BookStore.Authors.Create'" id="create" class="btn btn-primary"
                        type="button" (click)="createAuthor()">
                        <i class="fa fa-plus me-1"></i>
                        <span>{{ '::NewAuthor' | abpLocalization }}</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="card-body">
        <ngx-datatable [rows]="author.items" [count]="author.totalCount" default>

            <ngx-datatable-column [name]="convertToLocal('::Actions')" [maxWidth]="150" [sortable]="false">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <div ngbDropdown container="body" class="d-inline-block">
                        <button class="btn btn-primary btn-sm dropdown-toggle" data-toggle="dropdown"
                            aria-haspopup="true" ngbDropdownToggle>
                            <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
                        </button>
                        <div ngbDropdownMenu>
                            <!-- update & delete -->
                            <button *abpPermission="'BookStore.Authors.Edit'" ngbDropdownItem
                                (click)="editAuthor(row.id)">
                                {{ '::Edit' | abpLocalization }}
                            </button>
                            <button *abpPermission="'BookStore.Authors.Delete'" ngbDropdownItem
                                (click)="delete(row.id)">
                                {{ '::Delete' | abpLocalization }}
                            </button>
                        </div>
                    </div>
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column [name]="convertToLocal('::Name')" prop="name"></ngx-datatable-column>
            <ngx-datatable-column [name]="convertToLocal('::BirthDate')" prop="birthDate">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{ row.birthDate | date }}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="convertToLocal('::ShortBio')" prop="shortBio"></ngx-datatable-column>
        </ngx-datatable>
    </div>
</div>
<!-- Adding / Updating Form-->
<div *ngIf="isModalOpen">
    <div>
        <h3 *ngIf="!selectedAuthor">{{ '::NewAuthor' | abpLocalization }}</h3>
        <h3 *ngIf="selectedAuthor">{{ '::UpdatedAuthor' | abpLocalization }}</h3>
    </div>
    <div>
        <form [formGroup]="form">
            <div class="mt-2">
                <label for="author-name">{{'::Name' | abpLocalization}}</label><span> * </span>
                <input type="text" id="author-name" class="form-control" formControlName="name" autofocus />
            </div>
            <div class="mt-2">
                <label for="author-publish-date">{{'::BirthDate' | abpLocalization}}</label><span> * </span>
                <input type="date" id="author-publish-date" class="form-control" formControlName="birthDate" />
            </div>
            <div class="mt-2">
                <label for="author-short-bio">{{'::ShortBio' | abpLocalization }}</label><span> * </span>
                <textarea id="author-short-bio" class="form-control" formControlName="shortBio" rows="12"></textarea>
            </div>
        </form>
    </div>
    <!-- Form Footer -->
    <div>
        <button type="button" class="btn btn-secondary" (click)="closeModal()">
            {{ '::Close' | abpLocalization }}
        </button>

        <button class="btn btn-primary" (click)="save()">
            <i class="fa fa-check mr-1"></i>
            {{ '::Save' | abpLocalization }}
        </button>
    </div>
</div>
